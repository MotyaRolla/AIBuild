# AIBuild — AI structure generation and editing
# LLM: DeepSeek V4.1 Flash through the Command Code subscription (https://commandcode.ai)

api:
  # Command Code API key (user_...). Can also be supplied via the env variable COMMANDCODE_API_KEY.
  key: ""
  base-url: "https://api.commandcode.ai"
  model: "deepseek/deepseek-v4.1-flash"
  # auto = Provider API (Pro/GOAT plans), switches to /alpha/generate automatically for Go-plan keys
  transport: auto            # auto | provider | generate
  temperature: 0.6           # set to -1 to use the provider default
  connect-timeout-seconds: 20
  idle-timeout-seconds: 240  # abort a stream that sends nothing for this long
  max-retries: 3
  cli-version: auto          # x-command-code-version header for the generate transport ("auto" = npm latest)

generation:
  # Thinking mode used when a player has not chosen one with /aib mode (fast | light | standard | extra)
  default-mode: standard
  # script   = the AI writes one JavaScript build program (smooth shapes, materials, kits; see stdlib/api-card.md)
  #            that runs in a sandbox; errors go back to the AI as a traceback (default)
  # studio   = one session in which the AI runs its own build loop: it writes the script, sees renders and the
  #            analysis after every run, looks wherever it wants, reads the builder's handbook, can hand parts to
  #            helpers, and says itself when the build is done. Nothing it makes is rejected (see studio: below)
  # compiled = one JSON op program (1.x behaviour); staged = plan + separate construction calls
  create-strategy: script
  auto-orient: true          # auto-correct stair facing / slab type from context (roof slopes, wall-backed, chairs)
  # Self-verification: "adaptive" = reviewers work through a checklist and decide themselves when everything is
  # verified (stops early, continues while fixes need re-checking, capped by adaptive-max-rounds);
  # "fixed" = up to verify-rounds rounds of the mode.
  review-strategy: adaptive
  adaptive-max-rounds: 6
  # Change requests:
  #   "plan"   = edit plan (area, steps, acceptance criteria) -> one call builds everything -> verify by criteria
  #   "steps"  = edit plan -> each step built separately (slower, fragments style) -> verify by criteria
  #   "direct" = one call writes all operations (old behaviour)
  edit-strategy: plan
  min-score: 86              # reviewer score needed to approve
  repair-failed-ops: true    # ask the AI to fix ops that failed (bad block names etc.)
  live-preview: true         # place intermediate results so players watch the build grow
  # One-time live link: every job gets an unguessable URL that shows the build growing in a browser, the
  # program the AI is typing right now and the pipeline stage. The link is shown in chat, works only for
  # that run, and is revoked expire-minutes after the build ends.
  live-view:
    enabled: true
    bind: "127.0.0.1"        # loopback only: put a tunnel or reverse proxy in front to expose it
    port: 0                  # 0 = first free port; set a fixed one if your proxy needs it
    # Address players are given in chat (e.g. "https://builds.example.com"). Empty = the loopback URL is
    # only logged for the operator, because it cannot be opened from another machine.
    public-url: ""
    max-viewers: 8           # concurrent browser event streams
    expire-minutes: 15       # how long a finished build's link keeps working
  max-concurrent-jobs: 2
  max-extent: 160            # max size of a build along any axis (half-size around the plot centre)
  distance: 3                # gap between the player and the build front
  include-block-list: true   # send the full 26.3 block list to the model (better validity)

script:
  repair-attempts: 3         # calls to fix a script that fails (syntax/API/runtime errors are sent back verbatim)
  fallback-to-ops: true      # if it still fails, build with the classic JSON-op program instead
  # independent scripts written in parallel for a new build; the best one is kept (fewest analyzer defects,
  # then the vision judge)
  candidates:
    fast: 1
    light: 1
    standard: 2
    extra: 3
  # critic rounds after construction: the AI looks at the rendered build, the analysis and its script and edits
  # the script; a revision is kept only if it adds no analyzer defects and the judge does not prefer the old build
  critic-rounds:
    fast: 0
    light: 1
    standard: 1
    extra: 2
  # seconds into a build after which the critic rounds are skipped (unless the build has critical defects), so a
  # build finishes in time; 0 = always run them
  review-deadline:
    fast: 0
    light: 0
    standard: 1500
    extra: 0
  # after the best candidate is chosen, an art director looks at the renders and picks the parts that would gain
  # most from more work (face, entrance, roof...); that many sculptors rewrite one part each in parallel, seeing a
  # close-up of it. The rewrite is kept only if it runs, makes nothing worse (floating, unsupported or dark cells,
  # blocked doors, rooms, blocks of other parts destroyed) and the judge does not prefer the old build.
  sculptors:
    fast: 0
    light: 0
    standard: 3
    extra: 5
  sculpt-effort: high        # reasoning of the art director, the sculptors and the interior designer
  sculpt-style: refine       # refine = keep the part's structure and kits, add craft; rewrite = redesign the part
  # first of all, the request is worked out into a full brief: typos fixed, translated, sizes read the way the
  # user meant them, and the style spelled out as buildable features and real blocks. Every later stage sees the
  # user's words first and this brief under them (1 = on, 0 = off)
  enhance:
    fast: 0
    light: 1
    standard: 1
    extra: 1
  enhance-effort: high       # reasoning of the request enhancer
  # before the candidates are written, a lead designer writes one short design concept per candidate (layout,
  # size, signature details, palette), so the candidates try different ideas; what the request states is kept
  # (1 = on, 0 = off)
  concepts:
    fast: 0
    light: 0
    standard: 1
    extra: 1
  concept-effort: high       # reasoning of the concept call when the mode's plan effort is off (else that is used)
  # an interior designer sees every room found inside the build from above and furnishes them in one extra part
  # (runs after the sculptors, on their result; reasoning = sculpt-effort); kept only if it changes nothing outside
  # the rooms and makes nothing worse (1 = on, 0 = off)
  interiors:
    fast: 0
    light: 1
    standard: 1
    extra: 1
  # self-check: after a sculptor's or the interior designer's work passes the checks, it sees what it built
  # (close-ups before and after, the blocks the runtime skipped, the quality numbers) and corrects it once or
  # answers KEEP; a correction that breaks something is dropped and the checked version stays (1 = on, 0 = off)
  self-check:
    fast: 0
    light: 0
    standard: 1
    extra: 1
  # in standard and extra, the create prompt asks the model to settle the design in its thinking and write the
  # script only once, in the answer (live builds drafted the whole script in their reasoning, then wrote it again)
  write-once: true
  sculpt-timeout: 900        # seconds for all sculptors; a slower one is stopped and its part stays as it was
  # after the last review step, code repairs what the analyzer points at cell by cell: decoration written into
  # walls, removed stairs, unsupported lights and torches, furniture in doorways, floating crumbs, dark rooms.
  # The repairs are appended to the script as part('finish'), so it still reproduces the build.
  finisher: true

# The studio (generation.create-strategy: studio, or the "studio" bench variant). The plugin executes and reports;
# the AI decides everything else. Only these limits remain:
studio:
  # wall clock of a new build in minutes; the AI sees the time left in every reply and ships when it is done
  # (or the current version ships when the time is up)
  minutes:
    fast: 8
    light: 15
    standard: 30
    extra: 60
  # parallel sessions of a new build; with 2+ the blind pairwise judge picks one (no extra wall time)
  sessions:
    fast: 1
    light: 1
    standard: 1
    extra: 2
  edit-minutes: 15           # an /aib edit session on a studio build
  max-turns: 40              # a fuse against a session that loops, not a budget
  delegate: true             # the AI may hand parts to helper sessions running in parallel
  helper-turns: 12           # turns of one helper session

vision:
  enabled: true              # send renders to the AI (checked once per session with a test image)
  judge: true                # pairwise visual judge for candidate selection and accepting critic revisions
  image-size: 1536           # width of each render sheet in pixels (3 x 2 textured views)
  judge-effort: high         # reasoning per judge call (two calls per comparison, sides swapped)

# Thinking modes. Players pick one with /aib mode <id>, or per request: /aib create --mode extra ...
# Reasoning effort per pipeline role: off | low | medium | high | xhigh | max
#   plan            design brief (script builds: the design concepts)    build   each construction stage / the build scripts
#   review          first self-review round (3 parallel experts: structure / exterior / interior)
#   review-followup later fix-up rounds     edit    change requests (/aib edit, chat mode)
# verify-rounds: max self-review rounds (stops early once all reviewers approve and checks pass)
# max-tokens: output budget per call incl. thinking (393216 is the model limit and the most allowed). If a call spends the whole budget
#   thinking, it is retried automatically with one level less effort.
modes:
  fast:
    title: "Без думания"
    eta: "~3–5 мин"
    plan: "off"
    build: "off"
    review: "off"
    review-followup: "off"
    edit: "off"
    verify-rounds: 3
    edit-verify-rounds: 1
    max-tokens: 32000
  light:
    title: "Лёгкое думание"
    eta: "~8–11 мин"
    plan: "off"
    build: low
    review: "off"
    review-followup: "off"
    edit: low
    verify-rounds: 2
    edit-verify-rounds: 1
    max-tokens: 60000
  standard:
    title: "Стандарт"
    eta: "время зависит от сложности"
    plan: max
    build: high
    review: high
    review-followup: high
    edit: high
    verify-rounds: 3
    edit-verify-rounds: 1
    max-tokens: 393216
    parallel-review: false
  extra:
    title: "Экстра-думание"
    eta: "время зависит от сложности"
    plan: max
    build: max
    review: max
    review-followup: high
    edit: high
    verify-rounds: 3
    edit-verify-rounds: 2
    max-tokens: 393216

bench:
  judge-effort: high         # reasoning of the blind judge in /aib bench

render:
  # auto = download the vanilla client jar once from Mojang (piston-meta.mojang.com), derive one colour per block
  # from its textures for renders and the AI's visual checks, keep only plugins/AIBuild/textures/<ver>/colors.json.
  # The textures are Mojang's; their use is governed by the Minecraft EULA. off = built-in approximate colours.
  textures: auto

placement:
  blocks-per-tick: 4000
  foundation-block: cobblestone
  max-foundation-depth: 12

debug:
  save-transcripts: true     # plugins/AIBuild/logs/<build>/...
  stage-snapshots: true      # a render and a quality.txt row of every accepted stage in that log
